<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Merci | DIAZBEATS</title>
<style>:root{color-scheme:dark light}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1110;color:#efe9dc;font:16px/1.55 system-ui,sans-serif;text-align:center;padding:24px}@media(prefers-color-scheme:light){body{background:#f3efe6;color:#15130e}}h1{font-size:40px;margin:0 0 12px}a.b{display:inline-block;background:#e8d3a8;color:#14110a;padding:14px 26px;border-radius:99px;font-weight:600;text-decoration:none;margin:14px 0}p{max-width:36ch;margin:8px auto}</style></head><body><div><h1>Merci pour ton achat</h1><p id="m">Vérification du paiement…</p><div id="o"></div><p><a href="/">Retour au site</a></p></div>
<script>
const id=new URLSearchParams(location.search).get("session_id");
(async()=>{try{const r=await fetch("/api/download?session_id="+encodeURIComponent(id||""));const d=await r.json();if(!r.ok)throw 0;
document.getElementById("m").textContent=d.title+" (licence "+d.license.toUpperCase()+"). Le lien reste valable une heure.";
document.getElementById("o").innerHTML='<a class="b" href="'+d.url+'">Télécharger mon fichier</a>'}
catch(e){document.getElementById("m").textContent="Le paiement n’a pas pu être confirmé. Si tu as été débité, écris-nous sur Instagram avec ton reçu Stripe."}})();
</script></body></html>
